<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="AI 知识图谱：用一张可交互的依赖图，把 AI 行业的知识点讲成一条可执行的学习路径。"
    />
    <title>AI 知识图谱</title>
    <!-- 分享卡片（og）：标题与描述先给通用定位文案，v2 前端阶段再按 PM 定位精修 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI 知识图谱：把 AI 知识讲成一张能走通的地图" />
    <meta
      property="og:description"
      content="三层讲解的知识节点、前置依赖图谱、学习路径，与面向 AI 产品经理的决策案例和面试题库。"
    />
    <!-- og:image 用绝对地址：各平台的抓取器不认相对路径 -->
    <meta property="og:image" content="https://eatenetae.github.io/ai-knowledge-graph/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="AI 知识图谱：三个知识节点连成一张小图，标题写着「把 AI 知识讲成一张能走通的地图」。"
    />
    <!-- 内联图标：省一次请求，也省掉 /favicon.ico 的 404 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='7' r='4.5' fill='%232f6df6'/%3E%3Ccircle cx='7' cy='24' r='3.5' fill='%2314a37f'/%3E%3Ccircle cx='25' cy='24' r='3.5' fill='%23a855c9'/%3E%3Cpath d='M16 11.5 L8.5 20.5 M16 11.5 L23.5 20.5' stroke='%23999' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // 在首帧之前定好主题，避免亮暗切换时闪一下白屏。
      (function () {
        try {
          var stored = localStorage.getItem('akg:theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>这个站点需要 JavaScript 才能渲染图谱。内容本身在仓库的 content/ 目录里，可以直接阅读。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
